<style>
/* Layout: one sheet of recycled paper on a desk, set like a booklet's table of contents */
:root{
  --desk:#D3CFC5; --paper:#F4F2EC; --ink:#272724; --pencil:#85827A; --rule:#D9D4C8; --seal:#B03A27;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--desk)}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:var(--f-hand);
  padding:clamp(16px,5vw,64px) 16px;display:flex;justify-content:center}
.sheet{width:100%;max-width:980px;background:var(--paper);padding:clamp(28px,6vw,72px) clamp(20px,6vw,80px) clamp(32px,5vw,56px);
  box-shadow:0 22px 44px -20px rgba(50,42,28,.42),0 2px 6px rgba(50,42,28,.08);position:relative}
.sheet::before{content:"";position:absolute;top:-16px;left:clamp(40px,30%,320px);width:150px;height:38px;
  background:rgba(176,58,39,.17);transform:rotate(-3deg)}
.kick{margin:0;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.kick i{font:italic 500 clamp(20px,2.4vw,28px)/1 var(--f-latin);color:var(--seal)}
.kick span{font-size:clamp(14px,1.6vw,18px);letter-spacing:.3em;color:var(--pencil)}
h1{font:900 clamp(40px,7vw,84px)/1.1 var(--f-display);letter-spacing:.08em;margin:18px 0 6px;text-wrap:balance}
.sub{margin:0 0 clamp(28px,4vw,44px);font-size:clamp(16px,1.9vw,21px);color:var(--pencil);letter-spacing:.08em}
ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
li a{display:grid;grid-template-columns:auto minmax(0,auto) minmax(32px,1fr) auto;align-items:baseline;gap:0 18px;
  padding:18px 4px;border-bottom:1px dotted var(--rule);color:inherit;text-decoration:none;transition:background .2s}
li a:hover{background:rgba(176,58,39,.05)}
li a:hover b{color:var(--seal)}
li a:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.tm{font:italic 500 clamp(20px,2.4vw,26px)/1 var(--f-latin);color:var(--seal);min-width:3.2em;font-variant-numeric:tabular-nums}
.tt{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt b{font:600 clamp(19px,2.3vw,26px)/1.35 var(--f-display);letter-spacing:.03em;transition:color .2s}
.tt small{font-size:clamp(14px,1.5vw,17px);color:var(--pencil);line-height:1.55}
.dots{border-bottom:2px dotted var(--pencil);opacity:.5;transform:translateY(-6px)}
.pg{font:italic 500 clamp(18px,2vw,22px)/1 var(--f-latin);color:var(--pencil);font-variant-numeric:tabular-nums}
.foot{margin-top:clamp(28px,4vw,40px);display:flex;justify-content:space-between;gap:18px 32px;flex-wrap:wrap;
  font-size:clamp(14px,1.5vw,16px);color:var(--pencil);line-height:1.8}
.foot a{color:var(--seal)}
kbd{font:600 .9em/1 ui-monospace,Consolas,monospace;padding:2px 7px;border:1px solid var(--pencil);border-bottom-width:2px;border-radius:4px;background:#FBFAF6;color:var(--ink)}
.seal{position:absolute;right:clamp(20px,6vw,72px);top:clamp(28px,6vw,64px);writing-mode:vertical-rl;
  font:900 clamp(22px,3vw,34px)/1.05 var(--f-display);color:var(--paper);background:var(--seal);padding:12px 9px;border-radius:4px;transform:rotate(-6deg)}
.tg{display:flex;align-items:center;gap:clamp(16px,3vw,28px);margin:0 0 clamp(24px,4vw,36px);padding:clamp(14px,2.4vw,20px) clamp(16px,2.6vw,24px);
  background:#FBFAF6;border-top:6px solid var(--seal);box-shadow:0 10px 22px -16px rgba(50,42,28,.5)}
.tg .qr{flex:none;width:clamp(120px,16vw,150px);aspect-ratio:1}
.tg .qr svg{display:block;width:100%;height:100%}
.tg .k{font-size:clamp(13px,1.4vw,15px);letter-spacing:.25em;color:var(--pencil)}
.tg b{display:block;font:600 clamp(22px,2.6vw,28px)/1.3 var(--f-display);letter-spacing:.08em;margin:4px 0 6px}
.tg p{margin:0;font-size:clamp(15px,1.6vw,18px);line-height:1.6;color:var(--ink)}
.tg a{color:var(--seal);word-break:break-all}
@media (max-width:640px){
  .tg{flex-direction:column;align-items:flex-start}
  .tg .qr{width:170px}
  li a{grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px}
  .dots{display:none}
  .seal{display:none}
}
</style>
</head>
